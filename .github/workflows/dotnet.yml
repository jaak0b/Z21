# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "Release/**" ]
  pull_request:
    branches: [ "Release/**" ]

jobs:
  build:

    runs-on: ubuntu-latest
    
    env:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore src/Z21.sln
    - name: Build
      run: dotnet build src/Z21.sln --no-restore
    - name: Test
      run: dotnet test src/Z21.sln --no-build --verbosity normal

    - name: Install Stryker.NET
      run: dotnet tool install -g dotnet-stryker

    - name: Run mutation tests
      run: |
        cd src/Z21.Client.UnitTest
        dotnet stryker --reporter  dashboard  --output ../../stryker-report --mutation-level Advanced
