name: Mutation Testing

on:
  push:
    branches: [ "Release/**" ]
  pull_request:
    branches: [ "Release/**" ]
  workflow_dispatch:

jobs:
  mutation-test:
    runs-on: ubuntu-latest

    env:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Warm up build with dotnet test
      run: dotnet test src/Z21.Client.UnitTest/Z21.Client.UnitTest.csproj --no-run
  
    - name: Install Stryker.NET
      run: dotnet tool install -g dotnet-stryker

    - name: Run mutation tests
      run: |
        cd src/Z21.Client.UnitTest
        dotnet stryker --reporter  dashboard  --output ../../stryker-report --mutation-level Advanced
